<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="description" content="MLTTC 更新日志：按版本倒序记录每次发版的改动">
	<title>更新日志 - MLTTC</title>
	<link rel="stylesheet" href="style/changelog.css">
	<script src="src/pages/main.js" type="module"></script>
	<script src="src/pages/changelog.js" type="module"></script>
	<script src="lib/ui/init.mjs" type="module"></script>
	<script src="/lib/ui/popup.mjs" type="module"></script>
	<script src="/src/auth-header.js" type="module"></script>
</head>

<body>
	<hcw-body-header>
		<div class="logo-area">
			<div class="logo-text">
				MLTTC - 更新日志
			</div>
		</div>
		<p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">Beta测试版，功能仍在完善中</p>
		<div id="headerAuthArea">
			<!-- 主题切换按钮 -->
			<hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
			<hcw-button id="globalLoginBtn" primary flat style="min-width: 5rem">登录</hcw-button>
		</div>
	</hcw-body-header>

	<hcw-article class="changelog">
		<header class="changelog-head">
			<p class="changelog-kicker">更新日志</p>
			<h1>更新日志</h1>
			<p class="changelog-lead">
				每次发版的改动都按版本倒序记在这里；1.2.7 起按版本整理，更早的改动收在页面底部。
			</p>
			<p class="changelog-meta" id="changelogMeta"></p>
		</header>

		<!-- 列表与占位互斥：脚本渲染成功才显示列表，其余情况只留一行提示 -->
		<p class="changelog-state" id="changelogState">正在加载更新日志…</p>
		<ol class="changelog-list" id="changelogList" hidden></ol>
		<section class="changelog-history" id="changelogHistory" hidden></section>
	</hcw-article>

	<hcw-body-footer></hcw-body-footer>

	<!-- 登录模态框 -->
	<div id="globalLoginModal" class="modal" style="align-items: center; display: none;">
		<div hcw-modal>
			<div hcw-modal-title>
				<h3>登录系统</h3>
				<hcw-button tp icon id="closeModalBtn">&times;</hcw-button>
			</div>
			<div hcw-modal-body>
				<hcw-input primary label="用户名" type="text" id="username" placeholder="邮箱/昵称" autocomplete="off"
					required></hcw-input>
				<hcw-input label="密码" type="password" id="password" placeholder="请输入密码" required></hcw-input>
				<div id="ErrorLogin" class="error-msg">
					<p>用户名或密码错误，请重新输入</p>
				</div>
				<hcw-button primary large id="login-btn" type="submit">登 录</hcw-button>
				<hcw-button id='RegisterBtn' large href="register.html">
					注册账户
				</hcw-button>
			</div>
		</div>
	</div>
</body>

</html>
