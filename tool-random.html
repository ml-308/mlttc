<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>随机与抽签 - MLTTC</title>
    <!-- 复用站内已有样式表：timetable.css 会导入 main.css，并提供表单 / 按钮组 / 结果卡片 / 菜单栏样式 -->
    <link rel="stylesheet" href="style/timetable.css">
    <!-- 复用 main.css 设计令牌的小范围补充样式（下拉框） -->
    <style>
        select.tool-select {
            appearance: none;
            -webkit-appearance: none;
            box-sizing: border-box;
            width: 100%;
            min-height: 2.6rem;
            padding: .7rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            color: var(--input-color);
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-fast);
            transition-property: background-color, box-shadow, border-color;
        }

        select.tool-select:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
            outline: none;
        }

        select.tool-select:hover {
            background-color: var(--input-bg-hl);
        }
    </style>

    <script src="src/pages/main.js" type="module"></script>
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/lib/ui/popup.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
    <script src="/src/pages/tool-random.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <!-- 出口：返回「游戏与工具」列表页 -->
        <hcw-button flat fill href="tools.html" style="min-width: 5rem;">返回</hcw-button>
        <div class="logo-area">
            <div class="logo-text">MLTTC - 随机与抽签</div>
        </div>
        <p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">实用小工具 · 本地运算不上传数据</p>
        <div id="headerAuthArea">
            <!-- 主题切换按钮 -->
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <!-- 动态显示登录按钮或用户信息 -->
            <hcw-button id="globalLoginBtn" primary flat style="min-width: 5rem">登录</hcw-button>
            <div id="globalUserInfo" style="display: none;">
                <span>欢迎，<strong id="globalDisplayName">用户</strong></span>
                <hcw-button id="globalLogoutBtn" tp flat inline style="min-width: 5rem">退出</hcw-button>
            </div>
        </div>
    </hcw-body-header>

    <hcw-article>
        <hcw-card>
            <h3 hcw-card-title>随机整数</h3>
            <p>课堂点号、抽样、分配任务都能用</p>
            <div class="grid-2col" style="margin-top: .75rem;">
                <div class="form-group">
                    <label>最小值</label>
                    <input hcw-input type="number" id="rdMin" value="1">
                </div>
                <div class="form-group">
                    <label>最大值</label>
                    <input hcw-input type="number" id="rdMax" value="100">
                </div>
                <div class="form-group">
                    <label>生成个数 <span class="optional">(1-100)</span></label>
                    <input hcw-input type="number" id="rdCount" min="1" max="100" value="1">
                </div>
                <div class="form-group">
                    <label>抽取方式</label>
                    <select class="tool-select" id="rdMode">
                        <option value="repeat">允许重复抽取</option>
                        <option value="unique">不重复抽取</option>
                    </select>
                </div>
            </div>
            <div class="btn-group">
                <hcw-button primary id="rdGoBtn">随机生成</hcw-button>
                <hcw-button id="rdCopyBtn">复制结果</hcw-button>
            </div>
            <div class="result-card hidden" id="rdOut"></div>
        </hcw-card>

        <hcw-card>
            <h3 hcw-card-title>名单抽签</h3>
            <div class="form-group" style="margin-top: .75rem;">
                <label>名单 <span class="optional">(每行一个，或用逗号 / 顿号分隔)</span></label>
                <textarea hcw-input id="nameList" rows="7" placeholder="张三、李四、王五、赵六"></textarea>
            </div>
            <div class="grid-2col" style="margin-top: .75rem;">
                <div class="form-group">
                    <label>抽取人数 <span class="optional">(1-100)</span></label>
                    <input hcw-input type="number" id="drawCount" min="1" max="100" value="1">
                </div>
                <div class="form-group">
                    <label>抽取模式</label>
                    <select class="tool-select" id="drawMode">
                        <option value="once">抽完不放回</option>
                        <option value="each">逐个独立抽取</option>
                    </select>
                </div>
            </div>
            <div class="btn-group">
                <hcw-button primary id="drawBtn">开始抽签</hcw-button>
                <hcw-button id="shuffleBtn">随机排序名单</hcw-button>
                <hcw-button id="drawCopyBtn">复制结果</hcw-button>
                <hcw-button variant="danger" id="drawClearBtn">清空</hcw-button>
            </div>
            <div class="result-card hidden" id="drawOut"></div>
        </hcw-card>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <!-- 登录模态框 -->
    <div id="globalLoginModal" class="modal" style="align-items: center; display: none;">
        <div hcw-modal>
            <div hcw-modal-title>
                <h3>登录系统</h3>
                <hcw-button tp icon id="closeModalBtn">&times;</hcw-button>
            </div>
            <div hcw-modal-body>
                <hcw-input primary label="用户名" type="text" id="username" placeholder="邮箱/昵称" autocomplete="off" required></hcw-input>
                <hcw-input label="密码" type="password" id="password" placeholder="请输入密码" required></hcw-input>
                <div id="ErrorLogin" class="error-msg">
                    <p>用户名或密码错误，请重新输入</p>
                </div>
                <hcw-button primary large id="login-btn" type="submit">登 录</hcw-button>
                <hcw-button id="RegisterBtn" large href="register.html">
                    注册账户
                </hcw-button>
            </div>
        </div>
    </div>
</body>

</html>
