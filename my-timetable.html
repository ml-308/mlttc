<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的时刻表 - MLTTC</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="style/timetable.css">
    <script src="/src/pages/main.js" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
    <script src="/src/pages/my-timetable.js" type="module"></script>
    <script src="/lib/ui/init.mjs" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <hcw-button flat fill style="min-width: 5rem;" id="backBtn">
            返回
        </hcw-button>
        <div class="logo-area">
            <div class="logo-text">
                MLTTC - 我的时刻表
            </div>
        </div>
        <p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">Beta测试版，功能仍在完善中</p>
        <div id="headerAuthArea">
            <!-- 主题切换按钮 -->
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <!-- 动态显示登录按钮或用户信息 -->
            <hcw-button id="globalLoginBtn" primary flat style="min-width: 5rem">登录</hcw-button>
        </div>
    </hcw-body-header>

    <hcw-article style="max-width: 36rem; margin: 0 auto;">
        <!-- 我的时刻表（原在个人主页内，现拆分为独立页面） -->
        <hcw-card>
            <hcw-card-title style="font-size: 1.1rem; display:flex; align-items:center; justify-content:space-between;">
                <span>我的时刻表</span>
                <hcw-button id="tt-refresh-btn" flat icon style="height:1.8rem;width:1.8rem; font-size:0.9rem;" aria-label="刷新">⟳</hcw-button>
            </hcw-card-title>
            <div id="myTimetableArea">
                <div id="timetable-loading" style="text-align:center; padding: 2rem 0; color: var(--text-muted);">加载中...</div>
                <div id="timetable-empty" class="hidden" style="text-align:center; padding: 2rem 0; color: var(--text-muted);">暂未写入时刻表</div>
                <div id="timetable-error" class="hidden" style="text-align:center; padding: 2rem 0; color: var(--danger);"></div>
                <div id="timetable-list" class="result-area result-list" style="margin-top: 0.5rem;"></div>
            </div>
        </hcw-card>
    </hcw-article>

    <hcw-body-footer>

    </hcw-body-footer>

    <!-- 登录模态框（结构需与其它页面保持一致，由 /src/pages/main.js 驱动） -->
    <div id="globalLoginModal" class="modal" style="align-items: center; display: none;">
        <div hcw-modal>
            <div hcw-modal-title>
                <h3>登录系统</h3>
                <hcw-button tp icon id="closeModalBtn">&times;</hcw-button>
            </div>
            <div hcw-modal-body>
                <hcw-input primary label="用户名" type="text" id="username" placeholder="邮箱/昵称" autocomplete="off" required></hcw-input>
                <hcw-input label="密码" type="password" id="password" placeholder="请输入密码" required></hcw-input>
                <div id="ErrorLogin" class="error-msg">
                    <p>用户名或密码错误，请重新输入</p>
                </div>
                <hcw-button primary large id="login-btn" type="submit">登 录</hcw-button>
                <hcw-button id='RegisterBtn' large href="register.html">
                    注册账户
                </hcw-button>
            </div>
        </div>
    </div>
</body>

</html>
