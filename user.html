<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - MLTTC</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="style/timetable.css">
    <script src="/src/pages/main.js" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
    <script src="/src/pages/user.js" type="module"></script>
    <script src="/lib/ui/init.mjs" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <hcw-button flat fill style="min-width: 5rem;" id="backBtn">
            返回
        </hcw-button>
        <div class="logo-area">
            <div class="logo-text">
                MLTTC - 用户主页
            </div>
        </div>
        <p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">Beta测试版，功能仍在完善中</p>
        <div id="headerAuthArea">
            <!-- 主题切换按钮 -->
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <!-- 动态显示登录按钮或用户信息 -->
            <hcw-button id="globalLoginBtn" primary flat style="min-width: 5rem">登录</hcw-button>
        </div>
    </hcw-body-header>

    <hcw-article style="max-width: 36rem; margin: 0 auto;">
        <!-- 资料卡：只展示后端返回的公开字段，邮箱一律用 emailMasked -->
        <hcw-card>
            <hcw-card-title style="font-size: 1.1rem;">
                <span id="userDisplayName">—</span>
            </hcw-card-title>
            <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.25rem;">
                <div style="display: flex; gap: 0.4rem; align-items: baseline;">
                    <span style="font-size: 0.72rem; color: var(--text-muted); min-width: 3.5rem;">城市</span>
                    <span id="userCity" style="font-size: 0.82rem; color: var(--text-secondary);">—</span>
                </div>
                <div style="display: flex; gap: 0.4rem; align-items: baseline;">
                    <span style="font-size: 0.72rem; color: var(--text-muted); min-width: 3.5rem;">注册时间</span>
                    <span id="userRegDate" style="font-size: 0.82rem; color: var(--text-secondary);">—</span>
                </div>
                <div style="display: flex; gap: 0.4rem; align-items: baseline;">
                    <span style="font-size: 0.72rem; color: var(--text-muted); min-width: 3.5rem;">邮箱</span>
                    <span id="userEmail" style="font-size: 0.82rem; color: var(--text-secondary);">—</span>
                </div>
            </div>
        </hcw-card>

        <!-- 该用户已上线的时刻表 -->
        <hcw-card style="margin-top: 1rem;">
            <hcw-card-title style="font-size: 1.1rem;">已上线时刻表</hcw-card-title>
            <div id="userTimetableArea">
                <!-- 三态容器：同一时刻只有一个可见，由 /src/pages/user.js 切换 -->
                <div id="profile-loading" style="text-align:center; padding: 2rem 0; color: var(--text-muted);">加载中...</div>
                <div id="profile-error" class="hidden" style="text-align:center; padding: 2rem 0; color: var(--danger);"></div>
                <div id="profile-empty" class="hidden" style="text-align:center; padding: 2rem 0; color: var(--text-muted);">该用户暂无已上线的时刻表</div>
                <div id="profile-missing" class="hidden" style="text-align:center; padding: 2rem 0; color: var(--text-muted);">
                    <p style="margin: 0 0 0.75rem;">参数缺失：链接中未包含 email 参数</p>
                    <hcw-button id="missingBackBtn" flat style="min-width: 6rem; font-size: 0.82rem;">返回</hcw-button>
                </div>
                <div id="timetable-list" class="result-area result-list hidden" style="margin-top: 0.5rem;"></div>
            </div>
        </hcw-card>
    </hcw-article>

    <hcw-body-footer>

    </hcw-body-footer>

    <!-- 登录模态框（结构需与其它页面保持一致，由 /src/pages/main.js 驱动） -->
    <div id="globalLoginModal" class="modal" style="align-items: center; display: none;">
        <div hcw-modal>
            <div hcw-modal-title>
                <h3>登录系统</h3>
                <hcw-button tp icon id="closeModalBtn">&times;</hcw-button>
            </div>
            <div hcw-modal-body>
                <hcw-input primary label="用户名" type="text" id="username" placeholder="邮箱/昵称" autocomplete="off" required></hcw-input>
                <hcw-input label="密码" type="password" id="password" placeholder="请输入密码" required></hcw-input>
                <div id="ErrorLogin" class="error-msg">
                    <p>用户名或密码错误，请重新输入</p>
                </div>
                <hcw-button primary large id="login-btn" type="submit">登 录</hcw-button>
                <hcw-button id='RegisterBtn' large href="register.html">
                    注册账户
                </hcw-button>
            </div>
        </div>
    </div>
</body>

</html>
