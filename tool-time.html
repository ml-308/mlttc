<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>时间与日期工具 - MLTTC</title>
    <!-- 复用站内已有样式表：timetable.css 会导入 main.css，并提供表单 / 按钮组 / 结果卡片 / 菜单栏样式 -->
    <link rel="stylesheet" href="style/timetable.css">

    <script src="src/pages/main.js" type="module"></script>
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/lib/ui/popup.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
    <script src="/src/pages/tool-time.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <!-- 出口：返回「游戏与工具」列表页 -->
        <hcw-button flat fill href="tools.html" style="min-width: 5rem;">返回</hcw-button>
        <div class="logo-area">
            <div class="logo-text">MLTTC - 时间与日期</div>
        </div>
        <p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">实用小工具 · 本地运算不上传数据</p>
        <div id="headerAuthArea">
            <!-- 主题切换按钮 -->
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <!-- 动态显示登录按钮或用户信息 -->
            <hcw-button id="globalLoginBtn" primary flat style="min-width: 5rem">登录</hcw-button>
            <div id="globalUserInfo" style="display: none;">
                <span>欢迎，<strong id="globalDisplayName">用户</strong></span>
                <hcw-button id="globalLogoutBtn" tp flat inline style="min-width: 5rem">退出</hcw-button>
            </div>
        </div>
    </hcw-body-header>

    <hcw-article>
        <hcw-card>
            <h3 hcw-card-title>当前时间</h3>
            <p>按本机时区实时刷新</p>
            <div class="result-card info">
                <p><strong>本地时间</strong><code id="nowLocal">—</code></p>
                <p><strong>秒级时间戳</strong><code id="nowSec">—</code>　<strong>毫秒时间戳</strong><code id="nowMs">—</code></p>
                <p><strong>UTC</strong><code id="nowUtc">—</code></p>
            </div>
        </hcw-card>

        <hcw-card>
            <h3 hcw-card-title>时间戳 → 日期</h3>
            <div class="form-group" style="margin-top: .75rem;">
                <label>时间戳 <span class="optional">(自动识别秒 / 毫秒 / 微秒)</span></label>
                <input hcw-input type="text" id="tsIn" placeholder="例: 1735660800 或 1735660800000">
            </div>
            <div class="btn-group">
                <hcw-button primary id="tsBtn">转换</hcw-button>
                <hcw-button id="tsNowBtn">填入当前时间戳</hcw-button>
            </div>
            <div class="result-card hidden" id="tsOut"></div>
        </hcw-card>

        <hcw-card>
            <h3 hcw-card-title>日期 → 时间戳</h3>
            <div class="grid-2col" style="margin-top: .75rem;">
                <div class="form-group">
                    <label>选择时间 <span class="optional">(本地时区)</span></label>
                    <input hcw-input type="datetime-local" id="dtIn">
                </div>
            </div>
            <div class="btn-group">
                <hcw-button primary id="dtBtn">转换</hcw-button>
                <hcw-button id="dtNowBtn">填入现在</hcw-button>
            </div>
            <div class="result-card hidden" id="dtOut"></div>
        </hcw-card>

        <hcw-card>
            <h3 hcw-card-title>日期差 / 倒计时</h3>
            <div class="grid-2col" style="margin-top: .75rem;">
                <div class="form-group">
                    <label>开始时间</label>
                    <input hcw-input type="datetime-local" id="fromIn">
                </div>
                <div class="form-group">
                    <label>结束时间</label>
                    <input hcw-input type="datetime-local" id="toIn">
                </div>
            </div>
            <div class="btn-group">
                <hcw-button primary id="diffBtn">计算差值</hcw-button>
                <hcw-button id="diffNowBtn">现在 → 未来 30 天</hcw-button>
                <hcw-button id="diffExamBtn">现在 → 2028 高考</hcw-button>
            </div>
            <div class="result-card hidden" id="diffOut"></div>
        </hcw-card>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <!-- 登录模态框 -->
    <div id="globalLoginModal" class="modal" style="align-items: center; display: none;">
        <div hcw-modal>
            <div hcw-modal-title>
                <h3>登录系统</h3>
                <hcw-button tp icon id="closeModalBtn">&times;</hcw-button>
            </div>
            <div hcw-modal-body>
                <hcw-input primary label="用户名" type="text" id="username" placeholder="邮箱/昵称" autocomplete="off" required></hcw-input>
                <hcw-input label="密码" type="password" id="password" placeholder="请输入密码" required></hcw-input>
                <div id="ErrorLogin" class="error-msg">
                    <p>用户名或密码错误，请重新输入</p>
                </div>
                <hcw-button primary large id="login-btn" type="submit">登 录</hcw-button>
                <hcw-button id="RegisterBtn" large href="register.html">
                    注册账户
                </hcw-button>
            </div>
        </div>
    </div>
</body>

</html>
