<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>密码生成器 - MLTTC</title>
    <!-- 复用站内已有样式表：timetable.css 会导入 main.css，并提供表单 / 按钮组 / 结果卡片 / 菜单栏样式 -->
    <link rel="stylesheet" href="style/timetable.css">
    <!-- 复用 main.css 设计令牌的小范围补充样式（长度滑块 / 强度条） -->
    <style>
        .tool-checks {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(13rem, 90vw), 1fr));
            gap: .5rem 1rem;
            margin-top: .5rem;
        }

        .tool-check {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-size: .85rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .tool-check input {
            width: 1rem;
            height: 1rem;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        input[type="range"].tool-range {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            height: .35rem;
            padding: 0;
            border: none;
            border-radius: var(--radius-full);
            background: var(--bg-hover);
            outline: none;
            cursor: pointer;
        }

        input[type="range"].tool-range::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 1.1rem;
            height: 1.1rem;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid var(--bg-card);
            box-shadow: var(--shadow-xs);
            cursor: pointer;
        }

        input[type="range"].tool-range::-moz-range-thumb {
            width: 1.1rem;
            height: 1.1rem;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid var(--bg-card);
            cursor: pointer;
        }

        .pw-meter {
            width: 100%;
            height: .5rem;
            border-radius: var(--radius-full);
            background: var(--bg-hover);
            overflow: hidden;
        }

        .pw-meter-bar {
            display: block;
            width: 0;
            height: 100%;
            border-radius: var(--radius-full);
            background: var(--danger);
            transition: width .25s ease, background-color .25s ease;
        }
    </style>

    <script src="src/pages/main.js" type="module"></script>
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/lib/ui/popup.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
    <script src="/src/pages/tool-password.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <!-- 出口：返回「游戏与工具」列表页 -->
        <hcw-button flat fill href="tools.html" style="min-width: 5rem;">返回</hcw-button>
        <div class="logo-area">
            <div class="logo-text">MLTTC - 密码生成器</div>
        </div>
        <p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">实用小工具 · 本地运算不上传数据</p>
        <div id="headerAuthArea">
            <!-- 主题切换按钮 -->
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <!-- 动态显示登录按钮或用户信息 -->
            <hcw-button id="globalLoginBtn" primary flat style="min-width: 5rem">登录</hcw-button>
            <div id="globalUserInfo" style="display: none;">
                <span>欢迎，<strong id="globalDisplayName">用户</strong></span>
                <hcw-button id="globalLogoutBtn" tp flat inline style="min-width: 5rem">退出</hcw-button>
            </div>
        </div>
    </hcw-body-header>

    <hcw-article>
        <hcw-card>
            <h3 hcw-card-title>密码生成器</h3>
            <p>纯本地生成，<b>不联网、不保存、不上传</b>，刷新页面即清空</p>

            <div class="form-group" style="margin-top: 1rem;">
                <label>密码长度 <span class="optional" id="pwLenLabel">16 位</span></label>
                <input type="range" class="tool-range" id="pwLen" min="6" max="64" value="16">
            </div>

            <div class="tool-checks">
                <label class="tool-check"><input type="checkbox" id="optUpper" checked> 大写字母 A-Z</label>
                <label class="tool-check"><input type="checkbox" id="optLower" checked> 小写字母 a-z</label>
                <label class="tool-check"><input type="checkbox" id="optDigit" checked> 数字 0-9</label>
                <label class="tool-check"><input type="checkbox" id="optSymbol"> 符号 !@#$%^&amp;*</label>
                <label class="tool-check"><input type="checkbox" id="optAmbig"> 排除易混淆字符 0 O 1 l I</label>
            </div>

            <div class="grid-2col" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>生成数量 <span class="optional">(1-10)</span></label>
                    <input hcw-input type="number" id="pwCount" min="1" max="10" value="1" placeholder="1">
                </div>
                <div class="form-group">
                    <label>强度预估 <span class="optional" id="pwLevel">—</span></label>
                    <div class="pw-meter"><span class="pw-meter-bar" id="pwMeterBar"></span></div>
                    <p class="lp" id="pwEntropy">先勾选字符集再生成</p>
                </div>
            </div>

            <div class="btn-group">
                <hcw-button primary id="genBtn">生成密码</hcw-button>
                <hcw-button id="copyPwBtn">复制全部</hcw-button>
                <hcw-button variant="danger" id="clearPwBtn">清空结果</hcw-button>
            </div>

            <div class="result-card hidden" id="pwOut"></div>
        </hcw-card>

        <hcw-card>
            <h3 hcw-card-title>使用建议</h3>
            <p>1. 每个账号使用<b>不同</b>的密码，避免「一码走天下」；</p>
            <p>2. 长度优先于复杂度：16 位以上比 8 位加符号更安全；</p>
            <p>3. 生成的密码请交给密码管理器保管，不要粘贴到聊天记录里。</p>
        </hcw-card>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <!-- 登录模态框 -->
    <div id="globalLoginModal" class="modal" style="align-items: center; display: none;">
        <div hcw-modal>
            <div hcw-modal-title>
                <h3>登录系统</h3>
                <hcw-button tp icon id="closeModalBtn">&times;</hcw-button>
            </div>
            <div hcw-modal-body>
                <hcw-input primary label="用户名" type="text" id="username" placeholder="邮箱/昵称" autocomplete="off" required></hcw-input>
                <hcw-input label="密码" type="password" id="password" placeholder="请输入密码" required></hcw-input>
                <div id="ErrorLogin" class="error-msg">
                    <p>用户名或密码错误，请重新输入</p>
                </div>
                <hcw-button primary large id="login-btn" type="submit">登 录</hcw-button>
                <hcw-button id="RegisterBtn" large href="register.html">
                    注册账户
                </hcw-button>
            </div>
        </div>
    </div>
</body>

</html>
