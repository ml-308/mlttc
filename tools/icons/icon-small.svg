<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MLTTC 公交时刻表">
  <!--
    MLTTC 站点图标 —— 16 / 24px 简化版。
    小尺寸下渐变、内描边、轮心镂空都会变成噪点，所以只留四件东西：
    实心圆角底、白色车身、两扇横向车窗、两只只露出底部的轮子。
    轮心 41 落在车身内（底 43.5），轮子只探出约 5/64，16px 上约 1.2px ——
    够让人读出「车」，又不至于变成挂件。
  -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="#1ed760"/>
  <rect x="6" y="15.5" width="52" height="28.5" rx="6" fill="#ffffff"/>
  <circle cx="18.5" cy="41" r="7.5" fill="#ffffff"/>
  <circle cx="45.5" cy="41" r="7.5" fill="#ffffff"/>
  <circle cx="18.5" cy="41" r="2.6" fill="#1ed760"/>
  <circle cx="45.5" cy="41" r="2.6" fill="#1ed760"/>
  <rect x="10.5" y="20.5" width="20" height="10.5" rx="2.5" fill="#1ed760"/>
  <rect x="33.5" y="20.5" width="20" height="10.5" rx="2.5" fill="#1ed760"/>
</svg>
