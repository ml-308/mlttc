<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MLTTC">
  <!--
    MLTTC apple-touch-icon 源文件（180×180 输出）。
    iOS 会给图标自己加圆角遮罩，所以底色铺满整块、不留透明边；
    字形与 icon.svg 完全同一套几何。
  -->
  <defs>
    <linearGradient id="tile" x1="6" y1="0" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee074"/>
      <stop offset="0.5" stop-color="#1ed760"/>
      <stop offset="1" stop-color="#12a34c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="32" y1="0" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="32" y1="40" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#002d0e" stop-opacity="0"/>
      <stop offset="1" stop-color="#002d0e" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" fill="url(#tile)"/>
  <rect x="0" y="0" width="64" height="40" fill="url(#sheen)"/>
  <rect x="0" y="40" width="64" height="24" fill="url(#shade)"/>

  <path d="M16 44V21.5L32 35 48 21.5V44" fill="none" stroke="#ffffff"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
