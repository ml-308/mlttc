<template id="template-hcw-modal-root">
    <style>
        .modal-root {
            /* display: none; */
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.4);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            animation: modalFadeOut 0.25s ease-in-out 0s 1 forwards;
            pointer-events: none;
        }

        .modal-root[open='true'] {
            animation: modalFadeIn 0.25s ease-in-out 0s 1 forwards;
            pointer-events: initial;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                display: flex;
            }

            to {
                opacity: 1;
                display: flex;
            }
        }

        @keyframes modalFadeOut {
            from {
                opacity: 1;
                display: flex;
            }

            to {
                opacity: 0;
                display: none;
            }
        }
    </style>
    <div class="modal-root">
        <slot></slot>
    </div>
</template>

<template id="template-hcw-button">
    <style>
        .inner-root {
            appearance: none;
            border: none;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* --hcw-button-radius：按钮圆角，默认取 --radius-full（500px 胶囊，与改动前一致） */
            border-radius: var(--hcw-button-radius, var(--radius-full));
            background-color: var(--button-bg);
            color: var(--button-color);
            /* --hcw-button-padding：按钮内距，默认 .55rem 1.15rem（改动前硬编码值） */
            padding: var(--hcw-button-padding, .55rem 1.15rem);
            transition: var(--transition-fast);
            transition-property: transform, background-color, color, box-shadow, opacity;
            text-align: center;
            cursor: pointer;
            /* --hcw-button-font-size：按钮字号，默认 0.95rem（改动前硬编码值） */
            font-size: var(--hcw-button-font-size, 0.95rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            /* --hcw-button-min-height / --hcw-button-min-width：按钮最小高/宽，默认 2.4rem */
            min-height: var(--hcw-button-min-height, 2.4rem);
            min-width: var(--hcw-button-min-width, 2.4rem);
            /* --hcw-button-gap：按钮内部内容间距，默认 0（改动前无 gap，钩子不产生视觉变化） */
            gap: var(--hcw-button-gap, 0);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            animation: general_fadeIn_fixed_noreplace_dontrestore var(--transition-slow) 0s 1 forwards;
        }

        :host-context(hcw-card)>.inner-root,
        :host-context([hcw-card])>.inner-root {
            background-color: var(--button-bg);
            border-radius: var(--hcw-button-radius, var(--radius-full));
            /* 卡片内按钮内距，默认 .5rem 1.05rem；页面层设 --hcw-button-padding 时一并跟随 */
            padding: var(--hcw-button-padding, .5rem 1.05rem);
        }

        :host-context(hcw-body-header)>.inner-root {
            background-color: var(--button-bg);
            color: var(--nav-text);
        }

        :host-context(hcw-body-header)>.inner-root:hover {
            background-color: var(--button-bg-hl);
            color: var(--nav-text);
        }

        :host-context(hcw-body-header)[tp]>.inner-root {
            background-color: transparent;
        }

        :host-context(hcw-body-header)[primary]>.inner-root {
            background-color: var(--primary);
            color: var(--on-primary);
        }

        :host-context(hcw-body-header)[primary]>.inner-root:hover {
            background-color: var(--primary-hl);
            color: var(--on-primary-hl);
            transform: scale(1.04);
        }

        :host([large])>.inner-root {
            /* --hcw-button-font-size-lg / --hcw-button-padding-lg：大号按钮字号与内距，默认 1.1rem / .7rem 1.5rem */
            font-size: var(--hcw-button-font-size-lg, 1.1rem);
            padding: var(--hcw-button-padding-lg, .7rem 1.5rem);
        }

        :host([inline])>.inner-root {
            display: inline-flex;
        }

        :host([icon])>.inner-root {
            aspect-ratio: 1;
            /* --hcw-button-icon-size：图标按钮边长，默认 2.4rem（改动前硬编码值） */
            height: var(--hcw-button-icon-size, 2.4rem);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        :host([icon][large])>.inner-root {
            /* --hcw-button-icon-min-height-lg：大号图标按钮最小高度，默认 3rem（改动前硬编码值） */
            min-height: var(--hcw-button-icon-min-height-lg, 3rem);
        }

        :host(:not([disabled], [primary], [variant]):hover)>.inner-root {
            background-color: var(--button-bg-hl);
            color: var(--button-color-hl);
        }

        :host([tp])>.inner-root {
            background-color: transparent;
        }

        :host([fill])>.inner-root {
            background-color: var(--button-fill-bg);
            color: var(--button-fill-color);
        }

        :host([variant='success'])>.inner-root {
            background-color: var(--success);
            color: var(--success-light);
        }

        :host([variant='danger'])>.inner-root {
            background-color: var(--danger);
            color: var(--danger-light);
        }

        :host([variant='warning'])>.inner-root {
            background-color: var(--warning);
            color: var(--warning-light);
        }

        :host([variant]:hover)>.inner-root {
            filter: brightness(1.05);
        }

        :host([primary])>.inner-root {
            background-color: var(--primary);
            color: var(--on-primary);
        }

        :host([primary]:hover)>.inner-root {
            background-color: var(--primary-hl);
            color: var(--on-primary-hl);
            transform: scale(1.04);
        }

        :host([flat])>.inner-root {
            box-shadow: none;
        }

        :host([disabled])>.inner-root {
            filter: saturate(0);
            cursor: not-allowed;
            box-shadow: none;
            color: var(--button-color-disabled);
            opacity: .5;
        }

        :host(:active:not([disabled]))>.inner-root {
            transform: scale(0.97);
        }
    </style>
    <div class="inner-root">
        <slot></slot>
    </div>
</template>

<template id="template-hcw-input">
    <style>
        .inner-root {
            display: flex;
            flex-direction: column;
            /* --hcw-input-gap：标签与输入框之间的间距，默认 6px */
            gap: var(--hcw-input-gap, 6px);
        }

        label {
            /* --hcw-input-label-font-size：输入框标签字号，默认 0.85rem */
            font-size: var(--hcw-input-label-font-size, 0.85rem);
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        input {
            appearance: none;
            border: 1px solid var(--border);
            position: relative;
            box-sizing: border-box;
            display: block;
            width: 100%;
            /* --hcw-input-radius：输入框圆角，默认取 --radius-sm（.5rem） */
            border-radius: var(--hcw-input-radius, var(--radius-sm));
            background-color: var(--input-bg);
            color: var(--input-color);
            /* --hcw-input-padding-block / --hcw-input-padding-inline：输入框内距，默认 .7rem / 1rem */
            padding: var(--hcw-input-padding-block, .7rem) var(--hcw-input-padding-inline, 1rem);
            transition: var(--transition-fast);
            transition-property: background-color, color, box-shadow, border-color;
            cursor: text;
            /* --hcw-input-font-size：输入框字号，默认 1rem */
            font-size: var(--hcw-input-font-size, 1rem);
            /* --hcw-input-min-height：输入框最小高度，默认 auto（改动前无此声明，加钩子不改高度） */
            min-height: var(--hcw-input-min-height, auto);
            outline: none;
            animation: general_fadeIn_fixed_noreplace_dontrestore var(--transition-slow) 0s 1 forwards;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
        }

        :host([large]) input {
            /* --hcw-input-font-size-lg：大号输入框字号，默认 1.25rem */
            font-size: var(--hcw-input-font-size-lg, 1.25rem);
        }

        :host(:not([disabled]):hover) input {
            background-color: var(--input-bg-hl);
            color: var(--input-color-hl);
        }

        :host([tp]) input {
            background-color: transparent;
        }

        :host([primary]) input::placeholder {
            opacity: .5;
            color: var(--primary);

            &:hover {
                color: var(--primary-hl);
            }
        }

        :host([disabled]) input {
            filter: saturate(0);
            cursor: not-allowed;
            box-shadow: none;
            color: var(--button-color-disabled);
        }
    </style>
    <div class="inner-root">
        <label>
            <slot name="label"></slot>
        </label>
        <input>
    </div>
</template>

<template id="template-hcw-textarea">
    <style>
        .inner-root {
            display: flex;
            flex-direction: column;
            /* --hcw-textarea-gap：标签与多行输入框之间的间距，默认 6px */
            gap: var(--hcw-textarea-gap, 6px);
        }

        label {
            /* --hcw-textarea-label-font-size：多行输入框标签字号，默认 0.85rem */
            font-size: var(--hcw-textarea-label-font-size, 0.85rem);
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        textarea {
            /* --hcw-textarea-height：多行输入框默认高度，默认 110px */
            height: var(--hcw-textarea-height, 110px);
            appearance: none;
            border: 1px solid var(--border);
            position: relative;
            box-sizing: border-box;
            display: block;
            width: 100%;
            /* --hcw-textarea-radius：多行输入框圆角，默认取 --radius-sm（.5rem） */
            border-radius: var(--hcw-textarea-radius, var(--radius-sm));
            background-color: var(--input-bg);
            color: var(--input-color);
            /* --hcw-textarea-padding-block / --hcw-textarea-padding-inline：内距，默认 .7rem / 1rem */
            padding: var(--hcw-textarea-padding-block, .7rem) var(--hcw-textarea-padding-inline, 1rem);
            transition: var(--transition-fast);
            transition-property: background-color, color, box-shadow, border-color;
            cursor: text;
            /* --hcw-textarea-font-size：多行输入框字号，默认 1rem */
            font-size: var(--hcw-textarea-font-size, 1rem);
            outline: none;
            resize: vertical;
            animation: general_fadeIn_fixed_noreplace_dontrestore var(--transition-slow) 0s 1 forwards;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
        }

        :host([large]) textarea {
            /* --hcw-textarea-font-size-lg：大号多行输入框字号，默认 1.25rem */
            font-size: var(--hcw-textarea-font-size-lg, 1.25rem);
        }

        :host(:not([disabled]):hover) textarea {
            background-color: var(--input-bg-hl);
            color: var(--input-color-hl);
        }

        :host([tp]) textarea {
            background-color: transparent;
        }

        :host([primary]) textarea::placeholder {
            opacity: .5;
            color: var(--primary);

            &:hover {
                color: var(--primary-hl);
            }
        }

        :host([disabled]) textarea {
            filter: saturate(0);
            cursor: not-allowed;
            box-shadow: none;
            color: var(--button-color-disabled);
        }

        textarea[readonly] {
            background-color: transparent;
            border: none;
            outline: none;
            resize: vertical;
            /* --hcw-textarea-radius-readonly：只读态多行输入框圆角，默认取 --radius-md（.5rem） */
            border-radius: var(--hcw-textarea-radius-readonly, var(--radius-md));
            backdrop-filter: none;
        }
    </style>
    <div class="inner-root">
        <label>
            <slot name="label"></slot>
        </label>
        <textarea></textarea>
    </div>
</template>

<template id="template-hcw-hero">
    <style>
        :host {
            position: relative;
            /* --hcw-hero-min-height：hero 最小高度，默认 auto（不限制）；
               首页在文档层设 --hcw-hero-min-height: 22rem 撑满首屏 */
            min-height: var(--hcw-hero-min-height, auto);
        }

        :host::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            aspect-ratio: 1;
            /* --hcw-hero-media-width：右侧装饰图最大宽度占宿主宽度的比例，默认 40% */
            max-width: var(--hcw-hero-media-width, 40%);
            background: url('/asset/bg-main.jpg') no-repeat center;
            background-size: cover;
            /* --hcw-hero-media-radius：装饰图圆角，默认取 --radius-lg（.5rem） */
            border-radius: var(--hcw-hero-media-radius, var(--radius-lg));
        }

        h1,
        h2,
        p {
            /* --hcw-hero-gap：hero 内标题/段落的外边距，默认 1rem */
            margin: var(--hcw-hero-gap, 1rem);
        }

        div {
            /* --hcw-hero-padding：hero 内容区内距，默认 1rem */
            padding: var(--hcw-hero-padding, 1rem);
            position: relative;
            /* --hcw-hero-content-width：hero 文字区最大宽度占比，默认 60% */
            max-width: var(--hcw-hero-content-width, 60%);
            word-wrap: break-all;
            overflow: hidden;
        }
    </style>
    <div>
        <slot></slot>
    </div>
</template>

<template id="template-hcw-popup">
    <style>
        .inner-root {
            max-width: 420px;
            width: 100%;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-lg);
            background-color: var(--bg-card);
            color: var(--text-primary);
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-xl);
            transition: var(--transition-fast);
            overflow: hidden;
            margin-bottom: 5rem;
        }

        [name='text'] {
            font-weight: 300;
            margin: 0;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        [name='btn-group'] {
            display: flex;
            gap: .5rem;
            margin-left: auto;
            flex-wrap: wrap;

            & hcw-button {
                min-width: max(5vw, 6.5rem);
            }
        }

        @media(max-width: 480px) {
            .inner-root {
                min-width: 100vw;
                border-radius: 0px;
            }

            [name='btn-group'] {
                flex-direction: column;
                margin-left: initial;
            }
        }
    </style>
    <hcw-modal-root>
        <div class="inner-root">
            <h2 name="text"></h2>
            <div name="btn-group">

            </div>
        </div>
    </hcw-modal-root>
</template>
