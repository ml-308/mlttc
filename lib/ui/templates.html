<template id="template-hcw-modal-root">
    <style>
        .modal-root {
            /* display: none; */
            position: fixed;
            inset: 0;
            z-index: 200;
            /* box-sizing: padding 计入 inset:0 的自身宽度，否则 100vw 的子元素会把遮罩撑出横向滚动 */
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            /* 卡片与屏幕边缘的安全距离，默认 1.5rem；窄屏按屏宽收缩，避免小屏只剩一条缝 */
            padding: var(--hcw-modal-padding, clamp(1rem, 5vw, 1.5rem));
            /* 内容高于视口时让遮罩自己滚，卡片不会被裁掉顶部 */
            overflow-y: auto;
            overscroll-behavior: contain;
            animation: modalFadeOut 0.25s ease-in-out 0s 1 forwards;
            pointer-events: none;
        }

        .modal-root[open='true'] {
            animation: modalFadeIn 0.25s ease-in-out 0s 1 forwards;
            pointer-events: initial;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                display: flex;
            }

            to {
                opacity: 1;
                display: flex;
            }
        }

        @keyframes modalFadeOut {
            from {
                opacity: 1;
                display: flex;
            }

            to {
                opacity: 0;
                display: none;
            }
        }
    </style>
    <div class="modal-root">
        <slot></slot>
    </div>
</template>

<template id="template-hcw-button">
    <style>
        .inner-root {
            appearance: none;
            border: none;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* --hcw-button-radius：按钮圆角，默认取 --radius-full（500px 胶囊，与改动前一致） */
            border-radius: var(--hcw-button-radius, var(--radius-full));
            background-color: var(--button-bg);
            color: var(--button-color);
            /* --hcw-button-padding：按钮内距，默认 .55rem 1.15rem（改动前硬编码值） */
            padding: var(--hcw-button-padding, .55rem 1.15rem);
            transition: var(--transition-fast);
            transition-property: transform, background-color, color, box-shadow, opacity;
            text-align: center;
            cursor: pointer;
            /* --hcw-button-font-size：按钮字号，默认 0.95rem（改动前硬编码值） */
            font-size: var(--hcw-button-font-size, 0.95rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            /* --hcw-button-min-height / --hcw-button-min-width：按钮最小高/宽，默认 2.4rem */
            min-height: var(--hcw-button-min-height, 2.4rem);
            min-width: var(--hcw-button-min-width, 2.4rem);
            /* --hcw-button-gap：按钮内部内容间距，默认 0（改动前无 gap，钩子不产生视觉变化） */
            gap: var(--hcw-button-gap, 0);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            animation: general_fadeIn_fixed_noreplace_dontrestore var(--transition-slow) 0s 1 forwards;
        }

        :host-context(hcw-card)>.inner-root,
        :host-context([hcw-card])>.inner-root {
            background-color: var(--button-bg);
            border-radius: var(--hcw-button-radius, var(--radius-full));
            /* 卡片内按钮内距，默认 .5rem 1.05rem；页面层设 --hcw-button-padding 时一并跟随 */
            padding: var(--hcw-button-padding, .5rem 1.05rem);
        }

        :host-context(hcw-body-header)>.inner-root {
            background-color: var(--button-bg);
            color: var(--nav-text);
        }

        :host-context(hcw-body-header)>.inner-root:hover {
            background-color: var(--button-bg-hl);
            color: var(--nav-text);
        }

        :host-context(hcw-body-header)[tp]>.inner-root {
            background-color: transparent;
        }

        :host-context(hcw-body-header)[primary]>.inner-root {
            background-color: var(--primary);
            color: var(--on-primary);
        }

        :host-context(hcw-body-header)[primary]>.inner-root:hover {
            background-color: var(--primary-hl);
            color: var(--on-primary-hl);
            transform: scale(1.04);
        }

        :host([large])>.inner-root {
            /* --hcw-button-font-size-lg / --hcw-button-padding-lg：大号按钮字号与内距，默认 1.1rem / .7rem 1.5rem */
            font-size: var(--hcw-button-font-size-lg, 1.1rem);
            padding: var(--hcw-button-padding-lg, .7rem 1.5rem);
        }

        :host([inline])>.inner-root {
            display: inline-flex;
        }

        :host([icon])>.inner-root {
            aspect-ratio: 1;
            /* --hcw-button-icon-size：图标按钮边长，默认 2.4rem（改动前硬编码值） */
            height: var(--hcw-button-icon-size, 2.4rem);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        :host([icon][large])>.inner-root {
            /* --hcw-button-icon-min-height-lg：大号图标按钮最小高度，默认 3rem（改动前硬编码值） */
            min-height: var(--hcw-button-icon-min-height-lg, 3rem);
        }

        :host(:not([disabled], [primary], [variant]):hover)>.inner-root {
            background-color: var(--button-bg-hl);
            color: var(--button-color-hl);
        }

        :host([tp])>.inner-root {
            background-color: transparent;
        }

        :host([fill])>.inner-root {
            background-color: var(--button-fill-bg);
            color: var(--button-fill-color);
        }

        :host([variant='success'])>.inner-root {
            background-color: var(--success);
            color: var(--success-light);
        }

        :host([variant='danger'])>.inner-root {
            background-color: var(--danger);
            color: var(--danger-light);
        }

        :host([variant='warning'])>.inner-root {
            background-color: var(--warning);
            color: var(--warning-light);
        }

        :host([variant]:hover)>.inner-root {
            filter: brightness(1.05);
        }

        :host([primary])>.inner-root {
            background-color: var(--primary);
            color: var(--on-primary);
        }

        :host([primary]:hover)>.inner-root {
            background-color: var(--primary-hl);
            color: var(--on-primary-hl);
            transform: scale(1.04);
        }

        :host([flat])>.inner-root {
            box-shadow: none;
        }

        :host([disabled])>.inner-root {
            filter: saturate(0);
            cursor: not-allowed;
            box-shadow: none;
            color: var(--button-color-disabled);
            opacity: .5;
        }

        :host(:active:not([disabled]))>.inner-root {
            transform: scale(0.97);
        }
    </style>
    <div class="inner-root">
        <slot></slot>
    </div>
</template>

<template id="template-hcw-input">
    <style>
        .inner-root {
            display: flex;
            flex-direction: column;
            /* --hcw-input-gap：标签与输入框之间的间距，默认 6px */
            gap: var(--hcw-input-gap, 6px);
        }

        label {
            /* 输入框标签字号，默认 0.85rem */
            font-size: var(--hcw-input-label-font-size, 0.85rem);
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            line-height: 1.3;
        }

        /* 没有 label 属性时（如弹窗里 showPrompt 不传标签）隐藏空标签，
           否则 .inner-root 的 gap 会凭空多出 6px，让输入框与上方文字对不齐 */
        :host(:not([label])) label {
            display: none;
        }

        input {
            appearance: none;
            border: 1px solid var(--border);
            position: relative;
            box-sizing: border-box;
            display: block;
            width: 100%;
            /* --hcw-input-radius：输入框圆角，默认取 --radius-sm（.5rem） */
            border-radius: var(--hcw-input-radius, var(--radius-sm));
            background-color: var(--input-bg);
            color: var(--input-color);
            /* --hcw-input-padding-block / --hcw-input-padding-inline：输入框内距，默认 .7rem / 1rem */
            padding: var(--hcw-input-padding-block, .7rem) var(--hcw-input-padding-inline, 1rem);
            transition: var(--transition-fast);
            transition-property: background-color, color, box-shadow, border-color;
            cursor: text;
            /* 输入控件不吃 UA 字体：显式跟随全站 --font-family，与弹窗正文同一张脸 */
            font-family: var(--font-family);
            /* --hcw-input-font-size：输入框字号，默认 1rem */
            font-size: var(--hcw-input-font-size, 1rem);
            /* --hcw-input-line-height：输入框行高，默认 1.4，单行文本垂直居中不贴边框 */
            line-height: var(--hcw-input-line-height, 1.4);
            /* --hcw-input-min-height：输入框最小高度，默认 auto（改动前无此声明，加钩子不改高度） */
            min-height: var(--hcw-input-min-height, auto);
            outline: none;
            animation: general_fadeIn_fixed_noreplace_dontrestore var(--transition-slow) 0s 1 forwards;
        }

        input::placeholder {
            /* 占位符用 --text-secondary 而非 --text-placeholder：后者在深浅两套主题下只有 ~3.1:1，
               压到 secondary 才够 4.5:1，同时仍比输入值（--input-color）低一档 */
            color: var(--text-secondary);
            opacity: 1;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
        }

        :host([large]) input {
            /* --hcw-input-font-size-lg：大号输入框字号，默认 1.25rem */
            font-size: var(--hcw-input-font-size-lg, 1.25rem);
        }

        :host(:not([disabled]):hover) input {
            background-color: var(--input-bg-hl);
            color: var(--input-color-hl);
        }

        :host([tp]) input {
            background-color: transparent;
        }

        :host([primary]) input::placeholder {
            opacity: .5;
            color: var(--primary);

            &:hover {
                color: var(--primary-hl);
            }
        }

        :host([disabled]) input {
            filter: saturate(0);
            cursor: not-allowed;
            box-shadow: none;
            color: var(--button-color-disabled);
        }
    </style>
    <div class="inner-root">
        <label for="hcw-input-control">
            <slot name="label"></slot>
        </label>
        <input id="hcw-input-control">
    </div>
</template>

<template id="template-hcw-textarea">
    <style>
        .inner-root {
            display: flex;
            flex-direction: column;
            /* --hcw-textarea-gap：标签与多行输入框之间的间距，默认 6px */
            gap: var(--hcw-textarea-gap, 6px);
        }

        label {
            /* --hcw-textarea-label-font-size：多行输入框标签字号，默认 0.85rem */
            font-size: var(--hcw-textarea-label-font-size, 0.85rem);
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            line-height: 1.3;
        }

        /* 同 input：无 label 属性时隐藏空标签，省掉一个无用的 gap */
        :host(:not([label])) label {
            display: none;
        }

        textarea {
            /* --hcw-textarea-height：多行输入框默认高度，默认 110px */
            height: var(--hcw-textarea-height, 110px);
            appearance: none;
            border: 1px solid var(--border);
            position: relative;
            box-sizing: border-box;
            display: block;
            width: 100%;
            /* --hcw-textarea-radius：多行输入框圆角，默认取 --radius-sm（.5rem） */
            border-radius: var(--hcw-textarea-radius, var(--radius-sm));
            background-color: var(--input-bg);
            color: var(--input-color);
            /* --hcw-textarea-padding-block / --hcw-textarea-padding-inline：内距，默认 .7rem / 1rem */
            padding: var(--hcw-textarea-padding-block, .7rem) var(--hcw-textarea-padding-inline, 1rem);
            transition: var(--transition-fast);
            transition-property: background-color, color, box-shadow, border-color;
            cursor: text;
            font-family: var(--font-family);
            /* --hcw-textarea-font-size：多行输入框字号，默认 1rem */
            font-size: var(--hcw-textarea-font-size, 1rem);
            /* --hcw-textarea-line-height：多行行高，默认 1.6，与弹窗正文同一档，多行输入读起来不憋 */
            line-height: var(--hcw-textarea-line-height, 1.6);
            outline: none;
            resize: vertical;
            animation: general_fadeIn_fixed_noreplace_dontrestore var(--transition-slow) 0s 1 forwards;
        }

        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 1;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
        }

        :host([large]) textarea {
            /* --hcw-textarea-font-size-lg：大号多行输入框字号，默认 1.25rem */
            font-size: var(--hcw-textarea-font-size-lg, 1.25rem);
        }

        :host(:not([disabled]):hover) textarea {
            background-color: var(--input-bg-hl);
            color: var(--input-color-hl);
        }

        :host([tp]) textarea {
            background-color: transparent;
        }

        :host([primary]) textarea::placeholder {
            opacity: .5;
            color: var(--primary);

            &:hover {
                color: var(--primary-hl);
            }
        }

        :host([disabled]) textarea {
            filter: saturate(0);
            cursor: not-allowed;
            box-shadow: none;
            color: var(--button-color-disabled);
        }

        textarea[readonly] {
            background-color: transparent;
            border: none;
            outline: none;
            resize: vertical;
            /* --hcw-textarea-radius-readonly：只读态多行输入框圆角，默认取 --radius-md（.5rem） */
            border-radius: var(--hcw-textarea-radius-readonly, var(--radius-md));
            backdrop-filter: none;
        }
    </style>
    <div class="inner-root">
        <label for="hcw-textarea-control">
            <slot name="label"></slot>
        </label>
        <textarea id="hcw-textarea-control"></textarea>
    </div>
</template>

<template id="template-hcw-hero">
    <style>
        :host {
            position: relative;
            /* --hcw-hero-min-height：hero 最小高度，默认 auto（不限制）；
               首页在文档层设 --hcw-hero-min-height: 22rem 撑满首屏 */
            min-height: var(--hcw-hero-min-height, auto);
        }

        :host::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            aspect-ratio: 1;
            /* --hcw-hero-media-width：右侧装饰图最大宽度占宿主宽度的比例，默认 40% */
            max-width: var(--hcw-hero-media-width, 40%);
            background: url('/asset/bg-main.jpg') no-repeat center;
            background-size: cover;
            /* --hcw-hero-media-radius：装饰图圆角，默认取 --radius-lg（.5rem） */
            border-radius: var(--hcw-hero-media-radius, var(--radius-lg));
        }

        h1,
        h2,
        p {
            /* --hcw-hero-gap：hero 内标题/段落的外边距，默认 1rem */
            margin: var(--hcw-hero-gap, 1rem);
        }

        div {
            /* --hcw-hero-padding：hero 内容区内距，默认 1rem */
            padding: var(--hcw-hero-padding, 1rem);
            position: relative;
            /* --hcw-hero-content-width：hero 文字区最大宽度占比，默认 60% */
            max-width: var(--hcw-hero-content-width, 60%);
            word-wrap: break-all;
            overflow: hidden;
        }
    </style>
    <div>
        <slot></slot>
    </div>
</template>

<template id="template-hcw-popup">
    <style>
        /* ── 弹窗卡片 ──────────────────────────────────────────────────
           结构：标题区（eyebrow + 标题 + 描述）× 正文内容（输入控件 / 版本对比）× 操作区。
           层级：eyebrow 给上下文 → 标题给结论（唯一的粗黑层）→ 描述用 secondary 收细节。
           关闭钮绝对定位在右上角，不占文档流；操作区用一条 hairline 与正文分开。
           布局量全部走 --hcw-popup-* 钩子，页面层可整体覆盖。 */
        .inner-root {
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            width: 100%;
            /* 卡片最大宽度，默认 420px：中文一行 ~21 字，一眼扫得完 */
            max-width: var(--hcw-popup-max-width, 420px);
            /* 卡片内距，默认 1.5rem */
            padding: var(--hcw-popup-padding, 1.5rem);
            /* 三段骨架的间距，默认 1.25rem */
            gap: var(--hcw-popup-gap, 1.25rem);
            margin: 0;
            border-radius: var(--hcw-popup-radius, var(--radius-xl));
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-family: var(--font-family);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-xl);
            transition: var(--transition-fast);
            overflow: hidden;
            /* 入场：卡片从下方轻轻浮起，与遮罩的淡入叠成一次呼吸 */
            animation: hcw-popup-card-in var(--transition-normal) 0s 1 both;
            /* 操作区按钮统一 44px 触控高度与胶囊内距：走 button 模板已有的变量钩子 */
            --hcw-button-min-height: var(--hcw-popup-button-height, 2.75rem);
            --hcw-button-padding: var(--hcw-popup-button-padding, .6rem 1.25rem);
            --hcw-button-font-size: var(--hcw-popup-button-font-size, .9375rem);
        }

        /* 卡片自身可聚焦（tabindex=-1），只作为焦点落点，不画焦点框 */
        .inner-root:focus {
            outline: none;
        }

        @keyframes hcw-popup-card-in {
            from {
                opacity: 0;
                transform: translateY(.75rem) scale(.985);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ── 标题区 ── */
        .header {
            display: flex;
            flex-direction: column;
            /* 标题与描述之间，默认 .5rem */
            gap: var(--hcw-popup-header-gap, .5rem);
            /* 给右上角关闭钮留出位置，长标题不会压到 × 上 */
            padding-inline-end: var(--hcw-popup-header-padding-end, 1.75rem);
            min-width: 0;
        }

        .header[hidden] {
            display: none;
        }

        /* eyebrow：补上下文（「更新可用」「危险操作」），小字号 + 大字距，不抢标题 */
        .eyebrow {
            margin: 0;
            font-size: var(--hcw-popup-eyebrow-font-size, .75rem);
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            line-height: 1.3;
            color: var(--hcw-popup-eyebrow-color, var(--primary));
        }

        .eyebrow[hidden] {
            display: none;
        }

        /* 标题：全卡唯一的粗黑层级：Spotify 用字重而不是字号堆层级 */
        .title {
            margin: 0;
            font-size: var(--hcw-popup-title-font-size, 1.1875rem);
            line-height: 1.35;
            font-weight: 800;
            letter-spacing: -.015em;
            color: var(--text-primary);
            /* 长无空格串（URL / 版本号）必须能断行，否则撑破卡片 */
            overflow-wrap: anywhere;
            text-wrap: pretty;
        }

        .title[hidden] {
            display: none;
        }

        /* 描述：比标题低一档字号 + secondary 色，长段读起来不压眼 */
        .text {
            margin: 0;
            font-size: var(--hcw-popup-text-font-size, .9375rem);
            line-height: 1.65;
            font-weight: 400;
            letter-spacing: 0;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
            text-wrap: pretty;
        }

        .text[hidden] {
            display: none;
        }

        /* 只有正文、没有标题时（旧调用方只传 text），让正文升格成标题：
           单句确认（「确定要删除…吗？」）不该被压成灰色小字。 */
        .header:not(:has(.title:not([hidden]))) .text {
            font-size: var(--hcw-popup-title-font-size, 1.1875rem);
            line-height: 1.35;
            font-weight: 800;
            letter-spacing: -.015em;
            color: var(--text-primary);
        }

        /* ── 正文内容区（showPrompt 的输入控件、版本对比块挂这里） ── */
        .content {
            display: flex;
            flex-direction: column;
            gap: var(--hcw-popup-content-gap, .875rem);
            min-width: 0;
        }

        .content:empty {
            display: none;
        }

        /* ── 操作区 ── */
        [name='btn-group'] {
            display: flex;
            flex-wrap: wrap;
            /* 按钮间距，默认 .625rem */
            gap: var(--hcw-popup-button-gap, .625rem);
            /* 主操作固定落右下角：视线扫完正文自然停在动作上 */
            justify-content: flex-end;
            align-items: center;
            /* 分隔线以上的留白，默认 1rem */
            padding-top: var(--hcw-popup-action-padding, 1rem);
            border-top: 1px solid var(--border-light);
        }

        [name='btn-group'] hcw-button {
            /* 按钮最小宽度，默认 6.5rem：窄屏也不会缩成小目标 */
            min-width: var(--hcw-popup-button-min-width, 6.5rem);
        }

        /* 关闭钮：32px 圆形热区，静止时只有一个 ×，悬停才浮现底色 */
        .close {
            position: absolute;
            top: var(--hcw-popup-close-offset, .875rem);
            inset-inline-end: var(--hcw-popup-close-offset, .875rem);
            appearance: none;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: var(--hcw-popup-close-size, 2rem);
            height: var(--hcw-popup-close-size, 2rem);
            padding: 0;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition-fast);
            -webkit-tap-highlight-color: transparent;
        }

        .close[hidden] {
            display: none;
        }

        .close svg {
            display: block;
            width: 1rem;
            height: 1rem;
        }

        .close:hover {
            background-color: var(--button-bg-hl);
            color: var(--text-primary);
        }

        .close:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        @media(max-width: 480px) {
            .inner-root {
                /* 吃满可用宽度、内距略收；不再用 min-width:100vw，否则遮罩会被撑出横向滚动 */
                max-width: none;
                padding: var(--hcw-popup-padding-narrow, 1.25rem);
                border-radius: var(--hcw-popup-radius-narrow, var(--radius-lg));
            }

            [name='btn-group'] {
                /* 窄屏按钮整行等分上下排：触控目标更大，也不会挤成一条 */
                flex-direction: column;
                align-items: stretch;
            }

            [name='btn-group'] hcw-button {
                min-width: 0;
            }
        }

        /* 用户要求减少动效时，卡片不再浮起（遮罩的淡入由 modal-root 自己处理） */
        @media(prefers-reduced-motion: reduce) {
            .inner-root {
                animation: none;
            }
        }
