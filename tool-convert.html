<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>单位换算 - MLTTC</title>
    <!-- 复用站内已有样式表：timetable.css 会导入 main.css，并提供表单 / 按钮组 / 结果卡片 / 菜单栏样式 -->
    <link rel="stylesheet" href="style/timetable.css">
    <!-- 复用 main.css 设计令牌的小范围补充样式（分类菜单 / 下拉框） -->
    <style>
        .menu-bar {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            justify-content: center;
            padding: 4px 0;
        }

        .menu-btn {
            flex: 1 1 auto;
            min-width: 84px;
            font-size: .9rem;
            white-space: nowrap;
        }

        select.tool-select {
            appearance: none;
            -webkit-appearance: none;
            box-sizing: border-box;
            width: 100%;
            min-height: 2.6rem;
            padding: .7rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            color: var(--input-color);
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-fast);
            transition-property: background-color, box-shadow, border-color;
        }

        select.tool-select:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
            outline: none;
        }

        select.tool-select:hover {
            background-color: var(--input-bg-hl);
        }
    </style>

    <script src="src/pages/main.js" type="module"></script>
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/lib/ui/popup.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
    <script src="/src/pages/tool-convert.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <!-- 出口：返回「游戏与工具」列表页 -->
        <hcw-button flat fill href="tools.html" style="min-width: 5rem;">返回</hcw-button>
        <div class="logo-area">
            <div class="logo-text">MLTTC - 单位换算</div>
        </div>
        <p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">实用小工具 · 本地运算不上传数据</p>
        <div id="headerAuthArea">
            <!-- 主题切换按钮 -->
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <!-- 动态显示登录按钮或用户信息 -->
            <hcw-button id="globalLoginBtn" primary flat style="min-width: 5rem">登录</hcw-button>
            <div id="globalUserInfo" style="display: none;">
                <span>欢迎，<strong id="globalDisplayName">用户</strong></span>
                <hcw-button id="globalLogoutBtn" tp flat inline style="min-width: 5rem">退出</hcw-button>
            </div>
        </div>
    </hcw-body-header>

    <hcw-article>
        <hcw-card>
            <h3 hcw-card-title>单位换算</h3>
            <p>覆盖长度、面积、体积、重量、温度、速度、时间、数据八类常用单位</p>
            <div class="menu-bar" id="catBar" style="margin-top: 1rem;">
                <hcw-button class="menu-btn" primary data-cat="length">长度</hcw-button>
                <hcw-button class="menu-btn" data-cat="area">面积</hcw-button>
                <hcw-button class="menu-btn" data-cat="volume">体积</hcw-button>
                <hcw-button class="menu-btn" data-cat="mass">重量</hcw-button>
                <hcw-button class="menu-btn" data-cat="temp">温度</hcw-button>
                <hcw-button class="menu-btn" data-cat="speed">速度</hcw-button>
                <hcw-button class="menu-btn" data-cat="time">时间</hcw-button>
                <hcw-button class="menu-btn" data-cat="data">数据</hcw-button>
            </div>
            <div class="grid-2col" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>数值</label>
                    <input hcw-input type="number" id="cvIn" step="any" value="1" placeholder="输入数值">
                </div>
                <div class="form-group">
                    <label>换算结果</label>
                    <input hcw-input type="text" id="cvOut" readonly placeholder="结果">
                </div>
                <div class="form-group">
                    <label>从</label>
                    <select class="tool-select" id="cvFrom"></select>
                </div>
                <div class="form-group">
                    <label>到</label>
                    <select class="tool-select" id="cvTo"></select>
                </div>
            </div>
            <div class="btn-group">
                <hcw-button primary id="cvSwapBtn">交换单位</hcw-button>
                <hcw-button id="cvCopyBtn">复制结果</hcw-button>
            </div>
            <p class="lp" id="cvFormula"></p>
        </hcw-card>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <!-- 登录模态框 -->
    <div id="globalLoginModal" class="modal" style="align-items: center; display: none;">
        <div hcw-modal>
            <div hcw-modal-title>
                <h3>登录系统</h3>
                <hcw-button tp icon id="closeModalBtn">&times;</hcw-button>
            </div>
            <div hcw-modal-body>
                <hcw-input primary label="用户名" type="text" id="username" placeholder="邮箱/昵称" autocomplete="off" required></hcw-input>
                <hcw-input label="密码" type="password" id="password" placeholder="请输入密码" required></hcw-input>
                <div id="ErrorLogin" class="error-msg">
                    <p>用户名或密码错误，请重新输入</p>
                </div>
                <hcw-button primary large id="login-btn" type="submit">登 录</hcw-button>
                <hcw-button id="RegisterBtn" large href="register.html">
                    注册账户
                </hcw-button>
            </div>
        </div>
    </div>
</body>

</html>
