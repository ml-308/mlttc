<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>游戏与工具 - MLTTC</title>
    <!-- 复用首页那套样式：卡片网格 .button-grid 与 hcw-card 都在其中 -->
    <link rel="stylesheet" href="style/index.css">
    <script src="src/pages/main.js" type="module"></script>
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/lib/ui/popup.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <!-- 返回按钮用 hcw-button 的 href（组件会自动原地跳转），无需额外脚本 -->
        <hcw-button flat fill href="/index.html" style="min-width: 5rem;">返回</hcw-button>
        <div class="logo-area">
            <div class="logo-text">
                MLTTC - 游戏与工具
            </div>
        </div>
        <p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">Beta测试版，功能仍在完善中</p>
        <div id="headerAuthArea">
            <!-- 主题切换按钮 -->
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <!-- 动态显示登录按钮或用户信息 -->
            <hcw-button id="globalLoginBtn" primary flat style="min-width: 5rem">登录</hcw-button>
            <div id="globalUserInfo" style="display: none;">
                <span>欢迎，<strong id="globalDisplayName">用户</strong></span>
                <hcw-button id="globalLogoutBtn" tp flat inline style="min-width: 5rem">退出</hcw-button>
            </div>
        </div>
    </hcw-body-header>

    <!-- 小游戏与实用工具入口 -->
    <hcw-article>
        <div class="button-grid">
            <hcw-card>
                <h3 hcw-card-title>贪吃蛇</h3>
                <p>经典贪吃蛇，支持键盘方向键 / WASD 与手机按键</p>
                <br>
                <hcw-button primary href="game.html">立即使用</hcw-button>
            </hcw-card>
            <hcw-card>
                <h3 hcw-card-title>走迷宫</h3>
                <p>随机生成的迷宫，可选起点 / 调节环路，记录轨迹与最佳成绩</p>
                <br>
                <hcw-button primary href="pan.html">立即使用</hcw-button>
            </hcw-card>
            <hcw-card>
                <h3 hcw-card-title>敬请期待</h3>
                <p>更多小工具制作中</p>
                <br>
                <hcw-button disabled>敬请期待</hcw-button>
            </hcw-card>
        </div>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <!-- 登录模态框 -->
    <div id="globalLoginModal" class="modal" style="align-items: center; display: none;">
        <div hcw-modal>
            <div hcw-modal-title>
                <h3>登录系统</h3>
                <hcw-button tp icon id="closeModalBtn">&times;</hcw-button>
            </div>
            <div hcw-modal-body>
                <hcw-input primary label="用户名" type="text" id="username" placeholder="邮箱/昵称" autocomplete="off" required></hcw-input>
                <hcw-input label="密码" type="password" id="password" placeholder="请输入密码" required></hcw-input>
                <div id="ErrorLogin" class="error-msg">
                    <p>用户名或密码错误，请重新输入</p>
                </div>
                <hcw-button primary large id="login-btn" type="submit">登 录</hcw-button>
                <hcw-button id='RegisterBtn' large href="register.html">
                    注册账户
                </hcw-button>
            </div>
        </div>
    </div>
</body>

</html>
